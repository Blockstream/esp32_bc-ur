name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Build with LLVM on both: on macOS clang is Apple Clang, the default anyway
    env:
      CC: clang
      CXX: clang++
    steps:
    - uses: actions/checkout@v6
    # tinycbor headers at the version Jade's ESP-IDF build pins (espressif/cbor 0.6.1)
    - run: |
        for h in cbor.h tinycbor-version.h; do
          curl -fsSL --create-dirs -o "$RUNNER_TEMP/include/$h" "https://raw.githubusercontent.com/intel/tinycbor/v0.6.1/src/$h"
        done
    - if: runner.os == 'macOS'
      run: brew install cppcheck
    - if: runner.os == 'macOS'
      run: cppcheck --enable=warning,performance,portability --inline-suppr --error-exitcode=1 .
    - run: ./configure
    - run: make lib CPPFLAGS="-I$RUNNER_TEMP/include"
    - run: sudo make install
